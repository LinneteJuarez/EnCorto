<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>En Corto · Admin</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    </style>
  </head>
  <body>
    <!-- Netlify CMS mounts itself into the body -->
    <script>
      // Le decimos al CMS dónde está el config.yml (sirviendo desde la raíz del sitio).
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/netlify-cms@^2.10.192/dist/netlify-cms.js"></script>
    <script>
      window.CMS.init({ config: { load_config_file: true, config_file: "/admin/config.yml" } });
    </script>
  </body>
</html>
