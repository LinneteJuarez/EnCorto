<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>En Corto</title>
  <link rel="stylesheet" crossorigin href="/assets/index-BesyoWuk.css">
</head>
<body>

<header>
  <div id="logo">
    <img src="/data/logo.svg" alt="En Corto" width="200" height="35" decoding="async" fetchpriority="high">
  </div>

  <nav>
    <button class="tab active" data-tab="inicio">●</button>
    <button class="tab" data-tab="hoy">Lo de Hoy</button>
    <button class="tab" data-tab="juegos">Juegos</button>
    <button class="tab" data-tab="foro">Foro</button>
    <button class="tab" data-tab="funding">Funding</button>
    <button class="tab" data-tab="archivo">Archivo</button>
  </nav>
</header>

<main>

  <!-- INICIO -->
  <section id="panel-inicio" class="panel active">
    <div class="inicio">
      <h1>¿Qué quieres<br>ver hoy?</h1>
      <p>Selecciona una pestaña para comenzar</p>
    </div>
  </section>

  <!-- LO DE HOY -->
  <section id="panel-hoy" class="panel">

    <div class="subtabs">
      <button class="subtab active" data-sub="global">Global</button>
      <button class="subtab" data-sub="politica">Política</button>
      <button class="subtab" data-sub="economia">Economía</button>
      <button class="subtab" data-sub="tec">Tec & Ciencia</button>
      <button class="subtab" data-sub="deportes">Deportes</button>
      <button class="subtab" data-sub="espectaculos">Espectáculos</button>
      <button class="subtab" data-sub="felices">Noticias felices</button>
    </div>

    <div class="subpanel active" data-subpanel="global">
      <div class="news-grid">
        <article class="news-card"></article>
        <article class="news-card"></article>
        <article class="news-card"></article>
      </div>
    </div>

    <div class="subpanel" data-subpanel="politica"><div class="news-grid"><article class="news-card"></article><article class="news-card"></article><article class="news-card"></article></div></div>
    <div class="subpanel" data-subpanel="economia"><div class="news-grid"><article class="news-card"></article><article class="news-card"></article><article class="news-card"></article></div></div>
    <div class="subpanel" data-subpanel="tec"><div class="news-grid"><article class="news-card"></article><article class="news-card"></article><article class="news-card"></article></div></div>
    <div class="subpanel" data-subpanel="deportes"><div class="news-grid"><article class="news-card"></article><article class="news-card"></article><article class="news-card"></article></div></div>
    <div class="subpanel" data-subpanel="espectaculos"><div class="news-grid"><article class="news-card"></article><article class="news-card"></article><article class="news-card"></article></div></div>
    <div class="subpanel" data-subpanel="felices"><div class="news-grid"><article class="news-card"></article><article class="news-card"></article><article class="news-card"></article></div></div>

  </section>

  <!-- JUEGOS -->
  <section id="panel-juegos" class="panel">
    <div class="games-grid">
      <div class="game-card">Juego 1</div>
      <div class="game-card">Juego 2</div>
      <div class="game-card">Juego 3</div>
    </div>
  </section>

  <!-- FORO -->
  <section id="panel-foro" class="panel">

    <div class="subtabs">
      <button class="subtab active" data-sub="perfil">Perfil</button>
      <button class="subtab" data-sub="comunidad">Comunidad</button>
      <button class="subtab" data-sub="anuncios">Anuncios</button>
      <button class="subtab" data-sub="juegos">Juegos</button>
    </div>

    <div class="subpanel active" data-subpanel="perfil">
      <div class="forum-section"></div>
    </div>
    <div class="subpanel" data-subpanel="comunidad"><div class="forum-section"></div></div>
    <div class="subpanel" data-subpanel="anuncios"><div class="forum-section"></div></div>
    <div class="subpanel" data-subpanel="juegos"><div class="forum-section"></div></div>

  </section>

  <!-- FUNDING -->
  <section id="panel-funding" class="panel">
    <div class="funding-layout">
      <div class="shop">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
      </div>
      <div class="donation">
        <textarea placeholder="Mensaje"></textarea>
        <button>Donar</button>
      </div>
    </div>
  </section>

  <!-- ARCHIVO -->
  <section id="panel-archivo" class="panel">

    <div class="subtabs">
      <button class="subtab active" data-sub="global">Global</button>
      <button class="subtab" data-sub="politica">Política</button>
      <button class="subtab" data-sub="economia">Economía</button>
      <button class="subtab" data-sub="tec">Tec & Ciencia</button>
      <button class="subtab" data-sub="deportes">Deportes</button>
      <button class="subtab" data-sub="espectaculos">Espectáculos</button>
      <button class="subtab" data-sub="felices">Noticias felices</button>
    </div>

    <div class="subpanel active" data-subpanel="global">
      <div class="news-grid">
        <article class="news-card"></article>
        <article class="news-card"></article>
        <article class="news-card"></article>
      </div>
    </div>

    <div class="subpanel" data-subpanel="politica"></div>
    <div class="subpanel" data-subpanel="economia"></div>
    <div class="subpanel" data-subpanel="tec"></div>
    <div class="subpanel" data-subpanel="deportes"></div>
    <div class="subpanel" data-subpanel="espectaculos"></div>
    <div class="subpanel" data-subpanel="felices"></div>

  </section>

</main>

<script src="script.js"></script>
</body>
</html>
